[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-forecasting-recommender"
version = "0.1.0"
description = "MLOps project for ecommerce forecasting and recommendations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Copilot" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]
mlops = [
  "mlflow>=2.14.0",
  "evidently>=0.4.30",
  "apache-airflow>=2.10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
