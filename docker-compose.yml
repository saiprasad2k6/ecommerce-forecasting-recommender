services:
  api:
    build: .
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"

  airflow-webserver:
    image: apache/airflow:2.10.2
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-scheduler:
    image: apache/airflow:2.10.2
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
